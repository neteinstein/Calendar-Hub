name: Build

on:
  push:
  pull_request:

# A new push or PR update cancels the run still going for the same branch or PR.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  macos:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
      - name: Test
        run: swift test
      - name: Build app
        run: scripts/build-app.sh
