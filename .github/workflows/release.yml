name: Release

# Every version that lands on main is published as a GitHub release, tagged vX.Y.Z, with
# Calendar-Hub.dmg attached: the download for people who don't use Homebrew. A version that
# already has a release is skipped, so pushes that don't bump the version do nothing.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Read the version
        id: version
        run: echo "version=$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' Support/Info.plist)" >> "$GITHUB_OUTPUT"
      - name: Check for an existing release
        id: existing
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "v${{ steps.version.outputs.version }}" >/dev/null 2>&1; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Build the app (Apple silicon and Intel)
        if: steps.existing.outputs.exists == 'false'
        run: UNIVERSAL=1 scripts/build-app.sh
      - name: Pack the disk image
        if: steps.existing.outputs.exists == 'false'
        run: scripts/make-dmg.sh
      - name: Publish the release
        if: steps.existing.outputs.exists == 'false'
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          gh release create "v$VERSION" build/Calendar-Hub.dmg \
            --target "$GITHUB_SHA" \
            --title "Calendar Hub $VERSION" \
            --generate-notes \
            --notes "$(cat <<NOTES
          **Download:** [Calendar-Hub.dmg](https://github.com/$GITHUB_REPOSITORY/releases/download/v$VERSION/Calendar-Hub.dmg). Open it and drag Calendar Hub into Applications. The app isn't signed by Apple, so the first time you open it macOS says it can't check it for malicious software: click **Done**, then open System Settings › Privacy & Security and click **Open Anyway** next to Calendar Hub. [Step by step, with pictures](https://github.com/$GITHUB_REPOSITORY/blob/main/docs/download.md).

          **With Homebrew:** \`brew update && brew upgrade calendar-hub\`, or \`brew install neteinstein/tap/calendar-hub\`.
          NOTES
          )"
